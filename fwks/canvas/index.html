<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framework de Formas Geométricas</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; background-color: #e0e0e0; }
    </style>
</head>
<body>
    <!-- Exemplos de uso -->
    <arco posX="200" posY="150" raio="40" cor="red" mover="direita" comportamento="aumenta" colisao intercao></arco>
    <arco posX="500" posY="300" raio="40" cor="blue" mover="esquerda" comportamento="diminui" colisao></arco>
    <retangulo posX="600" posY="200" largura="60" altura="60" cor="green" mover="acima" colisao teleportavel></retangulo>
    <retangulo posX="100" posY="400" largura="50" altura="80" cor="red" mover="abaixo" colisao></retangulo>

    </body>
    <script src="canvas_v3.js"></script>
</html>
